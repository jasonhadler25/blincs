name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-reference:
    name: Rust reference (fmt, clippy, doc, vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - run: cargo test --release --locked
      - name: Compile and run fast deterministic checks on tools/upors_cert.rs
        working-directory: .
        run: rustc --edition 2024 -O -D warnings tools/upors_cert.rs -o /tmp/upors_cert_ci && /tmp/upors_cert_ci --fast && rm -f /tmp/upors_cert_ci

  lean4-formal:
    name: Lean 4 formalization (zero sorry, zero custom axioms)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install elan (SHA-256 verified) and pinned Lean 4 toolchain
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/leanprover/elan/3cc76985a1becb3c03cd65c1c5007e6f186ae474/elan-init.sh"
          EXPECTED="a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53"
          curl -fsSL "$URL" -o /tmp/elan-init.sh
          echo "$EXPECTED  /tmp/elan-init.sh" | sha256sum -c -
          sh /tmp/elan-init.sh -y --default-toolchain none
          rm -f /tmp/elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and verify zero sorryAx / zero custom axioms
        run: |
          set -euo pipefail
          lake build
          python3 - <<'PY'
          import re, subprocess, sys

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          expected = [
              "Blincs.key_contexts_distinct", "Blincs.encodeTweak_injective", "Blincs.tweak_fields_no_wrap",
              "Blincs.uporsLayerByte_ne_htLayer", "Blincs.frameContext_prefix_free", "Blincs.sliceCount_eq_spernerIE",
              "Blincs.wots_sperner_cardinality", "Blincs.wots_sperner_gt_pow116", "Blincs.wots_s680_lt_pow116",
              "Blincs.wots_w59_lt_pow116", "Blincs.upors_slice_count", "Blincs.uporsCode_sum",
              "Blincs.uporsCode_antichain", "Blincs.wots_dominance", "Blincs.chain_forgery_extract",
              "Blincs.merkleReconstruct_correct", "Blincs.merkle_forgery_collision", "Blincs.octopusClimbAux_extract",
              "Blincs.octopusExtractAux_len_eq_exactSibs", "Blincs.octopusClimbAux_sibs_consumed",
              "Blincs.octopus_forgery_collision", "Blincs.extractUporsLeaves_spec",
              "Blincs.validWotsHash_eq_of_digits_eq", "Blincs.wotsC_dominance",
              "Blincs.wotsCDigit_encodeWotsCDigits", "Blincs.encodeWotsCDigits_valid",
              "Blincs.encodeWotsCDigits_wotsCDigit", "Blincs.blincs_completeness",
              "Blincs.checkValidWotsHash_iff", "Blincs.checkValidUporsSel_iff",
              "Blincs.signNormative_sound", "Blincs.encodeImprint_length", "Blincs.encodeImprint_injective",
              "Blincs.decodeImprint_encodeImprint", "Blincs.decodeImprint_bad_len",
              "Blincs.blincs_forgery_dichotomy", "Blincs.rng_failure_hedged_fallback",
          ]
          query = "import Blincs\n" + "".join(f"#print axioms {t}\n" for t in expected)
          out = subprocess.check_output(["lake", "env", "lean", "--stdin"], input=query, text=True)
          print(out, end="")
          lines = [l.strip() for l in out.splitlines() if l.strip()]
          if len(lines) != len(expected):
              sys.exit(f"FAIL: expected {len(expected)} axiom lines, got {len(lines)}")
          seen = []
          for line in lines:
              m0 = re.fullmatch(r"'([^']+)' does not depend on any axioms", line)
              if m0:
                  seen.append(m0.group(1))
                  continue
              m = re.fullmatch(r"'([^']+)' depends on axioms: \[([^\]]+)\]", line)
              if not m:
                  sys.exit(f"FAIL: unexpected output format: {line}")
              seen.append(m.group(1))
              axioms = {a.strip() for a in m.group(2).split(",")}
              extra = axioms - allowed
              if extra:
                  sys.exit(f"FAIL: DISALLOWED AXIOM(S) {sorted(extra)} in: {line}")
          if seen != expected:
              sys.exit(f"FAIL: theorem list mismatch: {seen} vs {expected}")
          print(f"STRICT ALLOWLIST PASSED: all {len(seen)} expected theorems use only {sorted(allowed)}!")
          PY
