[package]
name = "blincs-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0 OR TGPPL-1.0"
description = "Teaching-clarity Rust reference implementation of BLINCS-128-7x5 on blake3-servil-core"
repository = "https://github.com/jasonhadler25/blincs"
publish = false

[dependencies]
blake3-servil-core = "=0.11.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
